# Настройки снабжения для расчёта заказа поставщику.
# Файл читается лениво; если его нет — берутся значения из DEFAULT_SUPPLY_SETTINGS.
supply_settings:
  # Средний срок поставки от поставщика, дней.
  delivery_days: 14
  # Страховой запас на случай задержки поставки, дней.
  safety_stock_days: 7
  # Длина периода отчёта по умолчанию, дней (если не удалось вычислить из дат в имени файла).
  default_period_days: 14
  # Минимальная реализация (Расход / (Начало + Приход)). Позиции ниже порога
  # в заказ поставщику не попадают. 0.4 = 40%.
  min_sell_through: 0.4
  # Префиксы артикулов, которые вообще рассматриваем для заказа.
  sku_prefixes: [PJ, SX, SO, FM, AD, MD, AL]
