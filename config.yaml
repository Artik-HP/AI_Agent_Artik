# Настройки снабжения для расчёта заказа поставщику.
# Файл читается лениво; если его нет — берутся значения из DEFAULT_SUPPLY_SETTINGS.
supply_settings:
  # Средний срок поставки от поставщика, дней.
  delivery_days: 14
  # Страховой запас на случай задержки поставки, дней.
  safety_stock_days: 7
  # Длина периода отчёта по умолчанию, дней (если не удалось вычислить из дат в имени файла).
  default_period_days: 18
  # Минимальная реализация (Расход / (Начало + Приход)). Позиции ниже порога
  # в заказ поставщику не попадают. 0.4 = 40%.
  min_sell_through: 0.4
  # Префиксы артикулов. НЕ фильтр заказа (префикс = бренд, а не категория) —
  # используются только как порядок сортировки строк в готовом файле и когда
  # префиксы заданы в запросе явно: «замовлення prefixes=SO,PR».
  sku_prefixes: [PJ, SX, SO, FM, AD, MD, AL]

  # Сужать ли заказ до категорий ниже ПО УМОЛЧАНИЮ. false = заказ собирается по
  # любому товару, а сузить можно на месте: «заказ только презервативы и
  # лубриканты» или кнопкой «🧴 Заказ: презервативы + лубриканты» в Telegram.
  # true = наоборот: заказ всегда только по категориям, а «заказ поставщику
  # весь товар» разово снимает сужение.
  order_categories_only: false
  # КАТЕГОРИИ ДЛЯ СУЖЕННОГО ЗАКАЗА. Слева — как категория называется в отчёте,
  # справа — слова, по которым она узнаётся в наименовании. Товар вне этих
  # категорий в суженном заказе не докупается: он перевозится между магазинами
  # (лист «Переміщення» в том же файле).
  order_categories:
    Презервативи: [презерватив, condom, кондом]
    Лубриканти: [лубрикант, змазк, смазк, мастил, lubricant, gleitgel]
  # В выгрузке 1С наименование начинается с категории: «Лубрикант Swiss Navy
  # NAKED 59 мл». Поэтому ключевое слово ищем не где угодно, а в первых N
  # символах: «Мастурбатор Tenga … з охолоджувальним лубрикантом» — мастурбатор.
  order_category_match_within: 45
  # Голова названия говорит, что это другой товар, даже если дальше встретится
  # «змазка» или «лубрикант».
  order_category_exclude: [масажна олія, масажне масло, массажное масло, мастурбатор, пінка, пенка]

# Правила переноса товара между магазинами («перенеси с Т1 где реализация<20%»).
transfer_settings:
  # На сколько дней продаж должен хватать остаток получателя.
  # Нужно получателю = его дневные продажи * cover_days - его остаток.
  # 36 дней = два обычных периода выгрузки (18 дн.). Считаем в днях, а не в
  # «периодах», чтобы выгрузка за 2 года не превратилась в запас на 4 года.
  cover_days: 36
  # Получатель считается нуждающимся, если его запаса меньше этого числа дней.
  max_stock_days: 30
  # Минимальная партия в одной строке перемещения, шт.
  min_batch: 2
  # Артикулы, которые никогда не переносим (регулярные выражения).
  # По умолчанию — подарочные сертификаты вида p500.
  exclude_sku_patterns: ['^p\d+$']

# Имена торговых точек. Код слева — то, как ты пишешь в запросе («с Т1»),
# справа — как точка называется в выгрузке. Секция необязательная:
# имена бот выучивает сам из строк-складов отчёта.
# points:
#   Т1: Toppers 01 Lviv Gnatuka
